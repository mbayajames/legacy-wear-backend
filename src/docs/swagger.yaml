    Legacy Wear E-commerce Platform API Documentation
    
    ## Features
    * **Authentication** - JWT-based authentication with Google OAuth
    * **Products** - Product catalog with search, filtering, and pagination
    * **Cart** - Shopping cart management for both guest and logged-in users
    * **Orders** - Order processing, tracking, and history
    * **Payments** - M-Pesa and Stripe payment integration
    * **Reviews** - Product reviews and ratings
    * **Wishlist** - Save favorite items
    * **Admin** - Dashboard statistics and management
    
    ## Authentication
    Most endpoints require a JWT token. Include it in the Authorization header:
    `Authorization: Bearer <your-jwt-token>`
    
    ## Rate Limiting
    - General API: 100 requests per 15 minutes
    - Authentication: 5 attempts per 15 minutes
    - Upload: 50 uploads per hour
    
    ## Response Format
    All responses follow this structure:
    ```json
    {
      "status": "success|fail|error",
      "data": {},
      "message": "Optional message",
      "errors": []
    }